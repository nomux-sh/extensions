#:schema https://raw.githubusercontent.com/nomux-sh/extension-api/main/schema/extension.schema.json

[extension]
id = "nomux.agent-claude"
name = "Claude Code adapter"
version = "0.1.1"
api = "^0.1.1"

[daemon]
command = "bin/nomux-agent-claude"
lazy = true

[adapter]
tools = ["claude"]

[permissions]
scopes = ["hooks:read", "agent:report"]
network = false
